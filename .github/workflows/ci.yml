# Every gate the repo has, on every PR and every push to main:
# lockfile-strict install, types, lint, tests, and all nine app builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 26 warnings is today's accepted set-state-in-effect debt (see
      # ARCHITECTURE.md §17); one more finding of any kind fails the build
      - run: npx eslint . --max-warnings 26
      - run: npm test
      - run: npm run build
