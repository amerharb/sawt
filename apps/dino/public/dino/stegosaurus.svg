<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
	<style>
		@media (prefers-reduced-motion: reduce) { .m { animation: none !important } }
		.sway { animation: sway 3.6s ease-in-out infinite; transform-origin: 60px 122px }
		@keyframes sway { 0%, 100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
		.graze { animation: graze 3.6s ease-in-out infinite; transform-origin: 132px 122px }
		@keyframes graze { 0%, 100% { transform: rotate(-1.5deg) } 50% { transform: rotate(2.5deg) } }
		.blink { animation: blink 5.2s ease-in-out infinite; transform-origin: 162px 131px }
		@keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
	</style>
	<ellipse cx="102" cy="180" rx="60" ry="6.5" fill="#000" opacity=".12"/>

	<!-- tail, ending in the four spikes -->
	<g class="sway m">
		<path d="M 58 110 Q 42 104 26 100 Q 23 113 32 123 Q 44 133 60 134 Z" fill="#6FA8C4"/>
		<g fill="#E9C46A" stroke="#C9A24A" stroke-width="1.1" stroke-linejoin="round">
			<path d="M 33 100 L 41 100 L 18 76 Z"/>
			<path d="M 29 106 L 35 100 L 6 88 Z"/>
			<path d="M 27 113 L 30 104 L 2 102 Z"/>
			<path d="M 29 120 L 27 112 L 4 120 Z"/>
		</g>
	</g>

	<!-- far legs -->
	<path d="M 80 140 L 78 170" stroke="#548CA6" stroke-width="13" fill="none" stroke-linecap="round"/>
	<path d="M 124 146 L 126 170" stroke="#548CA6" stroke-width="11" fill="none" stroke-linecap="round"/>

	<!-- the far row of plates: smaller, darker, standing between the near ones -->
	<g fill="#C9A24A">
		<path d="M 70 108 Q 70 96.6 77 89 Q 84 96.6 84 108 Z"/>
		<path d="M 83 96 Q 83 80.4 92 70 Q 101 80.4 101 96 Z"/>
		<path d="M 99 94 Q 99 78.4 108 68 Q 117 78.4 117 94 Z"/>
		<path d="M 115 104 Q 115 92.6 122 85 Q 129 92.6 129 104 Z"/>
	</g>

	<!-- the arched back: highest over the hips, lowest at the shoulder -->
	<path d="M 56 122 Q 60 94 90 89 Q 118 91 132 114 Q 140 128 136 142 Q 124 152 100 152 Q 72 150 62 138 Q 55 132 56 122 Z" fill="#6FA8C4"/>
	<ellipse cx="98" cy="140" rx="30" ry="11" fill="#A9D2E2"/>

	<!-- the near row of plates -->
	<g fill="#E9C46A" stroke="#C9A24A" stroke-width="1.2" stroke-linejoin="round">
		<path d="M 62.5 114 Q 62.5 103.2 70 96 Q 77.5 103.2 77.5 114 Z"/>
		<path d="M 74.5 100 Q 74.5 84.4 84 74 Q 93.5 84.4 93.5 100 Z"/>
		<path d="M 89.5 93 Q 89.5 75 100 63 Q 110.5 75 110.5 93 Z"/>
		<path d="M 105.5 97 Q 105.5 81.4 115 71 Q 124.5 81.4 124.5 97 Z"/>
		<path d="M 120.5 110 Q 120.5 99.2 128 92 Q 135.5 99.2 135.5 110 Z"/>
	</g>

	<!-- near legs: the hind pair long, the fore pair short -->
	<path d="M 90 144 L 88 174" stroke="#6FA8C4" stroke-width="16" fill="none" stroke-linecap="round"/>
	<path d="M 130 148 L 132 174" stroke="#6FA8C4" stroke-width="13" fill="none" stroke-linecap="round"/>

	<g class="graze m">
		<!-- a neck sloping down to a very small head -->
		<path d="M 130 124 Q 142 130 152 134" stroke="#6FA8C4" stroke-width="17" fill="none" stroke-linecap="round"/>
		<path d="M 146 127 Q 164 123 177 131 Q 180 139 170 142 Q 154 143 146 137 Z" fill="#6FA8C4"/>
		<path d="M 170 137 L 178 136" stroke="#4C7F97" stroke-width="2.2" fill="none" stroke-linecap="round"/>
		<g class="blink m">
			<circle cx="160" cy="132" r="3.1" fill="#2A2A2A"/>
			<circle cx="161.1" cy="130.9" r="1.1" fill="#fff"/>
		</g>
	</g>
</svg>
