<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@media (prefers-reduced-motion: reduce) { .padidm { animation: none !important } }
.padidsun { stroke-dasharray: 44; stroke-dashoffset: 44; animation: padiddr 1.8s linear forwards }
.padidhouse { stroke-dasharray: 90; stroke-dashoffset: 90; animation: padiddr 2s linear forwards; animation-delay: 2s }
.padidgrass { stroke-dasharray: 40; stroke-dashoffset: 40; animation: padiddr 1.2s linear forwards; animation-delay: 4.2s }
@keyframes padiddr { to { stroke-dashoffset: 0 } }
.padidpaints { animation: padidmv 5.6s ease-in-out forwards; transform-origin: 132px 102px }
@keyframes padidmv {
	0% { transform: rotate(-10deg) } 15% { transform: rotate(2deg) } 30% { transform: rotate(-8deg) }
	45% { transform: rotate(4deg) } 60% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) }
	90%, 100% { transform: rotate(14deg) }
}
</style>
<rect x="0" y="148" width="200" height="52" fill="#C98F4E"/><rect x="0" y="148" width="200" height="5" fill="#D9A662"/>
