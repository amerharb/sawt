<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@media (prefers-reduced-motion: reduce) { .cudidm { animation: none !important } }
.cudidblade { animation: cudidsn .5s ease-in-out 9 alternate }
@keyframes cudidsn { from { transform: rotate(0) } to { transform: rotate(-22deg) } }
.cudidtravel { animation: cudidtv 4.5s linear forwards }
@keyframes cudidtv { 0% { transform: translateX(0) } 100% { transform: translateX(46px) } }
.cudidcutline { stroke-dasharray: 46; stroke-dashoffset: 46; animation: cudidcl 4.5s linear forwards }
@keyframes cudidcl { to { stroke-dashoffset: 0 } }
.cudidleft { animation: cudidlf 6.5s ease-in-out forwards }
@keyframes cudidlf { 0%, 72% { transform: translate(0,0) rotate(0) } 88%, 100% { transform: translate(-5px,1px) rotate(-3deg) } }
.cudidright { animation: cudidrt 6.5s ease-in-out forwards }
@keyframes cudidrt { 0%, 72% { transform: translate(0,0) rotate(0) } 88%, 100% { transform: translate(5px,1px) rotate(3deg) } }
</style>
