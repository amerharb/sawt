		<ellipse cx="56" cy="149" rx="18" ry="4.5" fill="#6aa3d8"/>
		<ellipse cx="56" cy="150.5" rx="12" ry="2.4" fill="#5e93c6"/>
	</g>
	<path d="M 78 158 L 96 155.5" stroke="#999999" stroke-width="2.6" fill="none" stroke-linecap="round"/>
	<ellipse cx="75" cy="158.6" rx="4.2" ry="2.6" fill="#bbbbbb"/>
	<path d="M 112 118 Q 113 130 104 136" stroke="#F2C094" stroke-width="9.5" fill="none" stroke-linecap="round"/>
