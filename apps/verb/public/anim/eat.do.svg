<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
	<style>
		@media (prefers-reduced-motion: reduce) { .m { animation: none !important } }
		.bob { animation: bob 1.4s ease-in-out infinite }
		@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(1.4px) } }
		.flick { animation: flick 2.8s ease-in-out infinite }
		@keyframes flick {
			0%, 30% { transform: translate(-2px, 1px) }
			42%, 62% { transform: translate(0, 0) }
			74%, 100% { transform: translate(-2px, 1px) }
		}
		.tap { animation: tap .7s ease-in-out infinite }
		@keyframes tap { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-2.2px) } }
		.steam1 { animation: st 2.6s ease-in-out infinite }
		.steam2 { animation: st 2.6s ease-in-out infinite; animation-delay: .9s }
		@keyframes st { 0% { opacity: 0; transform: translateY(0) } 40% { opacity: .55 } 80%, 100% { opacity: 0; transform: translateY(-9px) } }
	</style>
	<rect x="78" y="110" width="56" height="46" rx="12" fill="#E05A4E"/>
	<g class="bob m">
		<circle cx="98" cy="84" r="23" fill="#F2C094"/>
		<clipPath id="hairDO"><rect x="73" y="59" width="50" height="17"/></clipPath>
		<circle cx="98" cy="84" r="23" fill="#5C4013" clip-path="url(#hairDO)"/>
		<circle cx="120" cy="87" r="4" fill="#F2C094"/>
		<g class="flick m"><circle cx="86" cy="80" r="2.4" fill="#333"/></g>
		<circle cx="80" cy="96" r="5" fill="#F2A488" opacity=".55"/>
		<path d="M 76 98 Q 81 102 86 98" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
	</g>
	<rect x="0" y="152" width="200" height="48" fill="#C98F4E"/>
	<rect x="0" y="152" width="200" height="6" fill="#D9A662"/>
	<path d="M 88 124 Q 72 130 64 144" stroke="#F2C094" stroke-width="9" fill="none" stroke-linecap="round"/>
	<path d="M 112 118 Q 100 132 90 146" stroke="#F2C094" stroke-width="9.5" fill="none" stroke-linecap="round"/>
	<g class="tap m"><circle cx="89" cy="148" r="5" fill="#F2C094"/></g>
	<path d="M 38 149 Q 38 166 56 166 Q 74 166 74 149 Z" fill="#7fb2e5"/>
	<ellipse cx="56" cy="149" rx="18" ry="4.5" fill="#6aa3d8"/>
	<ellipse cx="56" cy="149" rx="13" ry="2.8" fill="#FFCB3E"/>
	<ellipse cx="56" cy="146.5" rx="8.5" ry="3.2" fill="#FFCB3E"/>
	<path d="M 74 136 L 70 150" stroke="#999999" stroke-width="2.6" fill="none" stroke-linecap="round"/>
	<ellipse cx="69.5" cy="152" rx="4.2" ry="3.2" fill="#bbbbbb"/>
	<path class="steam1 m" d="M 50 140 q 3 -4 0 -8 q -3 -4 0 -8" stroke="#cccccc" stroke-width="2" fill="none" stroke-linecap="round"/>
	<path class="steam2 m" d="M 62 140 q 3 -4 0 -8 q -3 -4 0 -8" stroke="#cccccc" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
