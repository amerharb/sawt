@keyframes padonesp { 0%, 100% { opacity: .15; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }
.padonebob { animation: padoneb 3s ease-in-out infinite }
@keyframes padoneb { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1px) } }
</style>
