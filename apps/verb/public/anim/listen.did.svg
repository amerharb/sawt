<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
@media (prefers-reduced-motion: reduce) { .lididm { animation: none !important } }
.lididb1 { animation: lididbl 2.2s linear 3 forwards }
.lididb2 { animation: lididbl 2.2s linear 3 forwards; animation-delay: .4s }
.lididb3 { animation: lididbl 2.2s linear 3 forwards; animation-delay: .8s }
@keyframes lididbl { 0% { opacity: 0; transform: translate(0,0) } 25% { opacity: .9 } 70% { opacity: .5; transform: translate(9px,-5px) } 100% { opacity: 0; transform: translate(13px,-7px) } }
.lididspeak { opacity: 1; animation: lididsp 2.2s ease-in-out 3 forwards; transform-box: fill-box; transform-origin: 50% 50% }
@keyframes lididsp { 0% { transform: scaleY(.4) } 25% { transform: scaleY(1) } 50% { transform: scaleY(.5) } 75% { transform: scaleY(1) } 99% { transform: scaleY(.4); opacity: 1 } 100% { opacity: 0 } }
.lididnod { animation: lididnd 2.2s ease-in-out 3; transform-origin: 138px 96px }
@keyframes lididnd { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(4deg) } }
</style>
