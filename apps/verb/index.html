<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<link rel="icon" href="/favicon.svg"/>
	<!-- the room digits' font, fetched now rather than when the keypad first opens:
	     it blocks instead of swapping, so a late fetch would be a blank keypad -->
	<link rel="preload" href="/window-seat.woff2" as="font" type="font/woff2" crossorigin/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff"/>
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212"/>
	<meta
		name="description"
		content="Learn the names of verbs in different languages from animations"
	/>
	<link rel="manifest" href="/manifest.json"/>
	<title>Verb Web</title>
</head>
<body>
<!-- Apply the saved theme before first paint to avoid a flash of the wrong colors. -->
<script>(function(){try{var t;var s=localStorage.getItem('verb:settings');if(s){t=JSON.parse(s).theme}else{t=localStorage.getItem('theme')}if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}}catch(e){}})()</script>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
